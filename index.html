<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Accounting Database</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2>Ledger</h2>
        </div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('dashboard')">Dashboard</li>
            <li onclick="switchTab('transaction-entry')">Add Transaction</li>
            <li onclick="switchTab('reports')">Monthly Reports</li>
            <li onclick="switchTab('savings')">Savings Funds</li>
            <li onclick="switchTab('loans')">Loan Tracking</li>
        </ul>
    </nav>

    <main class="content">
        <!-- DASHBOARD TAB -->
        <section id="dashboard" class="tab-content active">
            <header>
                <h1>Financial Dashboard</h1>
                <div class="period-selector">
                    <select id="dash-month">
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <!-- Add all months -->
                    </select>
                    <select id="dash-year">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </header>

            <div class="summary-cards">
                <div class="card income">
                    <h3>Total Income</h3>
                    <h2 id="dash-income">₹0.00</h2>
                </div>
                <div class="card expense">
                    <h3>Total Expenditure</h3>
                    <h2 id="dash-expense">₹0.00</h2>
                </div>
                <div class="card balance">
                    <h3>Net Cash Flow</h3>
                    <h2 id="dash-net">₹0.00</h2>
                </div>
            </div>

            <div class="account-balances">
                <h3>Cash & Bank Balances</h3>
                <div class="grid-balances" id="balance-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>

        <!-- TRANSACTION ENTRY TAB -->
        <section id="transaction-entry" class="tab-content">
            <h1>Add Transaction</h1>
            <div class="form-container">
                <!-- STEP 1 -->
                <div id="step-1" class="form-step active">
                    <div class="form-group">
                        <label>Date of Transaction *</label>
                        <input type="date" id="tx-date" required>
                    </div>
                    <div class="form-group">
                        <label>Transaction Type *</label>
                        <select id="tx-type" required>
                            <option value="">Select Type</option>
                            <option value="Direct Income">Direct Income</option>
                            <option value="Indirect Inflow">Indirect Inflow</option>
                            <option value="Direct Expenditure">Direct Expenditure</option>
                            <option value="Indirect Outflow">Indirect Outflow</option>
                            <option value="Savings Funds">Savings Funds</option>
                            <option value="Transfer">Transfer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="tx-desc" placeholder="Optional details">
                    </div>
                    <button class="btn-primary" onclick="nextStep()">Continue</button>
                </div>

                <!-- STEP 2 (Dynamic based on Type) -->
                <div id="step-2" class="form-step">
                    <div id="dynamic-fields"></div>
                    
                    <div class="form-group">
                        <label>Amount (₹) *</label>
                        <input type="number" id="tx-amount" min="1" step="0.01" required>
                    </div>

                    <div class="btn-group">
                        <button class="btn-secondary" onclick="prevStep()">Back</button>
                        <button class="btn-primary" onclick="saveTransaction()" id="save-btn">Save Transaction</button>
                    </div>
                </div>
            </div>
            
            <!-- Loader & Notifications -->
            <div id="loader" class="hidden">Saving... Do not refresh.</div>
            <div id="notification" class="hidden"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
